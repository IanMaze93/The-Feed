[project]
name = "feed-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ian Maze", email = "mazeiandev@outlook.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.4",
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)"
]


[dependency-groups]
dev = [
    "pytest==9.0.1",
    "ruff==0.14.6",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
exclude = ["venv", ".venv", "build", "dist"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # basic linting + import sorting
